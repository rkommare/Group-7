<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fern-ware</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f6f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .chat-container {
            width: min(450px, calc(100vw - 24px));
            height: min(600px, calc(100vh - 24px));
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background-color: #2e6f40;
            color: white;
            padding: 15px;
            font-weight: bold;
            text-align: center;
        }

        .chat-log {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 82%;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .bot-message {
            background-color: #f0f0f0;
            align-self: flex-start;
            color: #333;
        }

        .user-message {
            background-color: #2e6f40;
            color: white;
            align-self: flex-end;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #eee;
            background: #fff;
        }

        #user-input {
            flex: 1;
            min-width: 0;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        #send-btn {
            background-color: #2e6f40;
            color: white;
            border: none;
            padding: 0 15px;
            margin-left: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #send-btn:hover { background-color: #22522e; }
        #send-btn:disabled { opacity: 0.6; cursor: wait; }

        .plant-results {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .plant-result-btn {
            padding: 6px 10px;
            border: 1px solid #2e6f40;
            border-radius: 6px;
            background: white;
            color: #2e6f40;
            cursor: pointer;
        }

        .plant-result-btn:hover {
            background: #2e6f40;
            color: white;
        }

        .plant-popup {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.55);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .plant-popup.show { display: flex; }

        .plant-popup-card {
            position: relative;
            width: min(400px, 85vw);
            padding: 24px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
        }

        #plant-popup-close {
            position: absolute;
            top: 10px;
            right: 10px;
            border: 0;
            background: transparent;
            cursor: pointer;
            font-size: 22px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">🌱 fern-ware</header>

        <main class="chat-log" id="chat-log">
            <div class="message bot-message">
                Hello! Describe your humidity and sunlight conditions as well as watering preferences, and I will
                recommend a houseplant.
            </div>
        </main>

        <footer class="chat-input-area">
            <input
                type="text"
                id="user-input"
                placeholder="Describe your conditions"
                autocomplete="off"
            >
            <button id="send-btn" type="button">Send</button>
        </footer>
    </div>

    <div id="plant-popup" class="plant-popup">
        <div class="plant-popup-card" role="dialog" aria-modal="true">
            <button id="plant-popup-close" type="button" aria-label="Close">×</button>
            <h2 id="plant-popup-title"></h2>
            <p id="plant-popup-description"></p>
            <p>Light: <span id="plant-popup-light"></span></p>
            <p>Water: <span id="plant-popup-water"></span></p>
            <p>Humidity: <span id="plant-popup-humidity"></span></p>
        </div>
    </div>

    <script src="nlp_app_full.js?v=finetuned-1"></script>
</body>
</html>
